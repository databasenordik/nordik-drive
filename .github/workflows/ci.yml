name: CI

on:
  pull_request:
    branches: [master]

jobs:
  unit:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit:ci

  e2e:
    name: E2E tests (Cypress)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cypress run
        # v7.4.4+ fixes readiness checks failing before the dev server starts.
        uses: cypress-io/github-action@v7.4.8
        with:
          install-command: npm ci --legacy-peer-deps
          start: npm start
          wait-on: http://localhost:3000
          wait-on-timeout: 180
          browser: chrome
