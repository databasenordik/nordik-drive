name: CD (React UI) Build + Push + Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: planar-ray-472112-e8
      REGION: us-west1

      # Cloud Run service name (UI)
      CLOUD_RUN_SERVICE: nordik-drive-react

      # Artifact Registry repo (UI)
      AR_REPO: nordikdriveui

      # Image name inside the repo
      IMAGE_NAME: nordik_drive_react

      # Artifact Registry hostname for the region
      REGISTRY: us-west1-docker.pkg.dev

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_URI=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build --no-cache -t "$IMAGE_URI" .

      # Request credentials after the build so they are fresh for push and deploy.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          # Resource identifiers are public configuration, not secret credentials.
          workload_identity_provider: projects/724838782318/locations/global/workloadIdentityPools/github-pool-ui/providers/github-provider-ui
          service_account: nordik-drive-deployer-ui@planar-ray-472112-e8.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push Docker image
        run: |
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_URI }}
          project_id: ${{ env.PROJECT_ID }}
